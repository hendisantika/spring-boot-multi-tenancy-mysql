services:
  mysql:
    image: mysql:9.4.0
    container_name: multitenancy-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 53cret
      MYSQL_DATABASE: master_db
      MYSQL_USER: yu71
      MYSQL_PASSWORD: 53cret
    ports:
      - "3301:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uyu71", "-p53cret" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - multitenancy-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: multitenancy-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: yu71
      PMA_PASSWORD: 53cret
      MYSQL_ROOT_PASSWORD: 53cret
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - multitenancy-network

networks:
  multitenancy-network:
    driver: bridge

volumes:
  mysql_data:
