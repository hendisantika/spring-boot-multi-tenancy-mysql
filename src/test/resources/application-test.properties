spring.application.name=spring-boot-multi-tenancy-mysql-test
# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# H2 Tenant 1 DataSource Configuration
spring.datasource.tenant1.jdbc-url=jdbc:h2:mem:tenant1_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.tenant1.username=sa
spring.datasource.tenant1.password=
spring.datasource.tenant1.driver-class-name=org.h2.Driver
# H2 Tenant 2 DataSource Configuration
spring.datasource.tenant2.jdbc-url=jdbc:h2:mem:tenant2_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.tenant2.username=sa
spring.datasource.tenant2.password=
spring.datasource.tenant2.driver-class-name=org.h2.Driver
# Server Configuration
server.port=0
